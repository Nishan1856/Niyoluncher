name: Build NiyoLauncher IPA

on:
  workflow_dispatch:
  push:
    branches:
      - niyo-fixes
      - niyo-voicechat-fix
    paths:
      - "Amethyst.xcodeproj/**"
      - "JavaApp/**"
      - "Natives/**"
      - "Makefile"
      - ".gitmodules"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

concurrency:
  group: niyo-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build iOS arm64 IPA
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode and show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        run: |
          brew install cmake ldid
          cmake --version
          ldid --version || true

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build IPA
        shell: bash
        run: |
          set -o pipefail
          echo "Using JDK: $JAVA_HOME"
          "${JAVA_HOME}/bin/java" -version
          "${JAVA_HOME}/bin/javac" -version
          make all BOOTJDK="${JAVA_HOME}/bin" 2>&1 | tee build-ipa.log

      - name: Upload IPA for SideStore signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NiyoLauncher-unsigned-sideload-IPA
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NiyoLauncher-build-log
          path: build-ipa.log
          if-no-files-found: warn
          retention-days: 7
